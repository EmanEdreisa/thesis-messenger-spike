<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Eatery Order Demo</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 16px;
    }
    button {
      font-size: 16px;
      padding: 8px 16px;
    }
  </style>
</head>
<body>
  <h1>Eatery Order Demo</h1>
  <p>This page demonstrates the Messenger ordering and Facebook posting features for Meta App Review.</p>

  <button id="connect-button">Connect Facebook Page</button>
  <p id="connection-status"></p>

  <div id="fb-root"></div>
  <script>
    const META_APP_ID = "28199264823035189";

    // from App Dashboard > Facebook Login for Business > Configurations
    const META_LOGIN_CONFIG_ID = "2360381744730579";

    window.fbAsyncInit = function () {
      FB.init({
        appId: META_APP_ID,
        version: "v26.0",
      });
    };

    function loadFacebookSdk() {
      const sdkScript = document.createElement("script");
      sdkScript.src = "https://connect.facebook.net/en_US/sdk.js";
      sdkScript.async = true;
      document.body.appendChild(sdkScript);
    }

    function showConnectedPages(pageNames) {
      const statusText = document.getElementById("connection-status");
      statusText.textContent = "Connected Page: " + pageNames.join(", ");
    }

    function showConnectionFailed() {
      console.log("facebook login did not complete");
      const statusText = document.getElementById("connection-status");
      statusText.textContent = "Connection failed or was cancelled.";
    }

    function handlePagesResponse(response) {
      if (!response || !response.data || response.data.length === 0) {
        showConnectionFailed();
        return;
      }

      const pageNames = response.data.map(function (page) {
        return page.name;
      });
      showConnectedPages(pageNames);
    }

    function handleLoginResponse(response) {
      if (response.status !== "connected") {
        showConnectionFailed();
        return;
      }

      FB.api("/me/accounts", handlePagesResponse);
    }

    function connectFacebookPage() {
      FB.login(handleLoginResponse, {
        config_id: META_LOGIN_CONFIG_ID,
      });
    }

    document.getElementById("connect-button").addEventListener("click", connectFacebookPage);

    loadFacebookSdk();
  </script>
</body>
</html>
