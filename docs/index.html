<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kusina Test Kitchen Order Manager</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 16px;
      color: #222;
    }

    h1 {
      margin-bottom: 4px;
    }

    p.subtitle {
      color: #555;
      margin-top: 0;
    }

    section {
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 16px;
      margin-bottom: 20px;
    }

    button {
      font-size: 15px;
      padding: 8px 16px;
      background: #2f6f4f;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    textarea {
      width: 100%;
      padding: 8px;
      font-family: inherit;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      padding: 8px 0;
      border-bottom: 1px solid #eee;
    }
  </style>
</head>
<body>
  <h1>Kusina Test Kitchen Order Manager</h1>
  <p class="subtitle">Manage the Facebook Page and check customer messages.</p>

  <section>
    <h2>Facebook Page</h2>
    <button id="connect-button">Connect Facebook Page</button>
    <p id="connection-status"></p>
  </section>

  <section>
    <h2>Publish to Page</h2>
    <textarea id="caption-input" rows="3" placeholder="Write a caption..."></textarea><br>
    <button id="publish-button">Publish to Page</button>
    <p id="publish-status"></p>
  </section>

  <section>
    <h2>Recent Messages</h2>
    <button id="refresh-button">Refresh</button>
    <ul id="messages-list"></ul>
  </section>

  <p><a href="privacy.html">Privacy Policy</a> | <a href="data-deletion.html">Delete Your Data</a></p>

  <div id="fb-root"></div>
  <script>
    const META_APP_ID = "28199264823035189";
    const META_LOGIN_SCOPE = "pages_show_list,pages_messaging,pages_manage_posts,pages_read_engagement";

    const PUBLISH_POST_URL = "https://axsgfztljaksrhzwpcca.supabase.co/functions/v1/publish-post";
    const LIST_MESSAGES_URL = "https://axsgfztljaksrhzwpcca.supabase.co/functions/v1/list-messages";
    // Project Settings > API > Publishable key
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_fafawNNfN0YbG9GI-i1hAw_oSx00LGJ";

    window.fbAsyncInit = function () {
      FB.init({
        appId: META_APP_ID,
        version: "v26.0",
      });
    };

    function loadFacebookSdk() {
      const sdkScript = document.createElement("script");
      sdkScript.src = "https://connect.facebook.net/en_US/sdk.js";
      sdkScript.async = true;
      document.body.appendChild(sdkScript);
    }

    function showConnectedPages(pageNames) {
      const statusText = document.getElementById("connection-status");
      statusText.textContent = "Connected Page: " + pageNames.join(", ");
    }

    function showConnectionFailed() {
      console.log("facebook login did not complete");
      const statusText = document.getElementById("connection-status");
      statusText.textContent = "Connection failed or was cancelled.";
    }

    function handlePagesResponse(response) {
      if (!response || !response.data || response.data.length === 0) {
        showConnectionFailed();
        return;
      }

      const pageNames = response.data.map(function (page) {
        return page.name;
      });
      showConnectedPages(pageNames);
    }

    function handleLoginResponse(response) {
      if (response.status !== "connected") {
        showConnectionFailed();
        return;
      }

      FB.api("/me/accounts", handlePagesResponse);
    }

    function connectFacebookPage() {
      FB.login(handleLoginResponse, {
        scope: META_LOGIN_SCOPE,
      });
    }

    function showPublishResult(postId) {
      const statusText = document.getElementById("publish-status");
      statusText.textContent = "Published. Post ID: " + postId;
    }

    function showPublishFailed() {
      const statusText = document.getElementById("publish-status");
      statusText.textContent = "Publish failed.";
    }

    async function publishPost() {
      const caption = document.getElementById("caption-input").value;

      try {
        const response = await fetch(PUBLISH_POST_URL, {
          method: "POST",
          headers: {
            Authorization: "Bearer " + SUPABASE_PUBLISHABLE_KEY,
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ caption: caption }),
        });

        if (!response.ok) {
          console.log("publish failed, status:", response.status);
          showPublishFailed();
          return;
        }

        const result = await response.json();
        showPublishResult(result.postId);
      } catch (error) {
        console.log("publish failed:", error);
        showPublishFailed();
      }
    }

    function renderMessages(messages) {
      const list = document.getElementById("messages-list");
      list.innerHTML = "";

      for (const message of messages) {
        const item = document.createElement("li");
        const text = message.messageText ?? "(no text)";
        const time = new Date(message.createdAt).toLocaleString();
        item.textContent = message.sender + ": " + text + " (" + time + ")";
        list.appendChild(item);
      }
    }

    async function loadMessages() {
      try {
        const response = await fetch(LIST_MESSAGES_URL, {
          headers: { Authorization: "Bearer " + SUPABASE_PUBLISHABLE_KEY },
        });

        if (!response.ok) {
          console.log("load messages failed, status:", response.status);
          return;
        }

        const result = await response.json();
        renderMessages(result.messages);
      } catch (error) {
        console.log("load messages failed:", error);
      }
    }

    document.getElementById("connect-button").addEventListener("click", connectFacebookPage);
    document.getElementById("publish-button").addEventListener("click", publishPost);
    document.getElementById("refresh-button").addEventListener("click", loadMessages);

    loadFacebookSdk();
    loadMessages();
  </script>
</body>
</html>
